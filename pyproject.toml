[project]
name = "call-me-maybe"
version = "0.1.0"
description = "42 Call Me Maybe project"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["llm_sdk", ".venv"]

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]